<!DOCTYPE html>
<html lang="en">

<head>
    <title>Counter App</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 600px;
            margin: 0 auto;
            padding: 30px 10px;
            background: #f4f6fa;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
        }

        .container {
            display: flex;
            gap: 24px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .counter-card {
            background: #fff;
            border-radius: 8px;
            padding: 24px 18px;
            width: 240px;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.06);
            text-align: center;
        }

        h2 {
            color: #444;
            margin-top: 0;
            font-size: 20px;
            margin-bottom: 18px;
        }

        .counter-value {
            font-size: 44px;
            font-weight: bold;
            color: #333;
            margin: 20px 0;
        }

        .counter-buttons {
            display: flex;
            justify-content: center;
            gap: 10px;
        }

        button {
            padding: 8px 18px;
            font-size: 22px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            background: #4CAF50;
            color: white;
            transition: background 0.2s;
        }

        button:active {
            background: #388e3c;
        }
    </style>
</head>

<body>
    <div id="root"></div>
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/babel-standalone@6/babel.min.js"></script>
    <script type="text/babel">
        const { useState } = React;

        class ClassCounter extends React.Component {
            constructor(props) {
                super(props);
                this.state = {
                    count: 0
                };
            }
            increment = () => this.setState({
                count: this.state.count + 1
            });
            decrement = () => this.setState({
                count: this.state.count - 1
            });
            render() {
                return (
                    <div className="counter-card">
                        <h2>Class Component</h2>
                        <div className="counter-value">{this.state.count}</div>
                        <div className="counter-buttons">
                            <button onClick={this.decrement}>
                                -
                            </button>
                            <button onClick={this.increment}>
                                +
                            </button>
                        </div>
                    </div>
                );
            }
        }

        function FunctionalCounter() {
            const [count, setCount] = useState(0);
            return (
                <div className="counter-card">
                    <h2>Functional Component</h2>
                    <div className="counter-value">{count}</div>
                    <div className="counter-buttons">
                        <button onClick={
                            () => setCount(count - 1)
                        }>
                            -
                        </button>
                        <button onClick={
                            () => setCount(count + 1)
                        }>
                            +
                        </button>
                    </div>
                </div>
            );
        }

        function App() {
            return (
                <div>
                    <h1>Counter App</h1>
                    <div className="container">
                        <ClassCounter />
                        <FunctionalCounter />
                    </div>
                </div>
            );
        }

        const rt = ReactDOM.createRoot(document.getElementById('root'));
        rt.render(
            <React.StrictMode>
            <App />
            </React.StrictMode>
        );
    </script>
</body>

</html>
